[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
braydr-core = { path = "crates/braydr-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
proptest = "1"

[workspace.lints.clippy]
all = "warn"
