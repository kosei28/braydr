[package]
name = "braydr-mcp"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
braydr-ipc = { path = "../braydr-ipc" }
rmcp = { version = "3", features = ["server", "transport-io"] }
